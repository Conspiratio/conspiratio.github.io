name: Seite bauen und veröffentlichen

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  bauen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Seite bauen
        run: bundle exec jekyll build
        env:
          JEKYLL_ENV: production
      - name: Ausgabe prüfen
        run: python werkzeug/pruefe_ausgabe.py
      - name: Verweise prüfen
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress --accept 200,206,429
            --root-dir "${{ github.workspace }}/_site"
            --exclude-path _site/assets
            '_site/**/*.html'
          # --root-dir ist nötig, sonst meldet lychee jeden wurzelrelativen Pfad
          # als Fehler ("Cannot resolve root-relative link") - beim ersten Lauf
          # waren das 392 von 479 Verweisen und der Bericht damit unlesbar.
          #
          # Absichtlich nicht fehlschlagend: Fremde Seiten verschwinden, ohne
          # dass die eigene Veröffentlichung daran scheitern soll. Die internen
          # Verweise prüft pruefe_ausgabe.py, und das schlägt sehr wohl fehl.
          # Bis Schritt 1 der DNS-Umstellung meldet lychee hier zu Recht
          # forum.conspiratio.net als nicht erreichbar - die Subdomain gibt es
          # noch nicht.
          fail: false
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  veroeffentlichen:
    needs: bauen
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
