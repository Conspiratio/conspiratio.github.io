title: Conspiratio
# Kurzfassung fuer den Browser-Tab. Ohne sie haengt jekyll-seo-tag auf der
# Startseite die ganze description an den Titel - das ergibt einen Tab-Titel
# ueber drei Zeilen.
tagline: Freie Wirtschaftssimulation der frühen Neuzeit
description: >-
  Conspiratio ist eine freie Wirtschaftssimulation der frühen Neuzeit: Handel, Ämter,
  Intrigen und eine Dynastie, die den eigenen Tod überdauern muss.
url: https://conspiratio.net
lang: de

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-redirect-from

permalink: /news/:year/:month/:day/:title/

defaults:
  - scope: { path: "", type: posts }
    values: { layout: news }
  - scope: { path: "" }
    values: { layout: seite }

feed:
  path: feed.xml
  posts_limit: 50   # Vorgabe waere 10; der Feed soll das ganze Archiv tragen

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - CLAUDE.md
  - LICENSE
  - docs/
  - werkzeug/
  - massenmails/
  - rohbilder/
  - "*.txt"

  # Quellmaterial: die unbearbeiteten Vorlagen der Bilder unter assets/bilder/.
  # Sie bleiben im Repo, damit sie sich neu aufbereiten lassen, gehoeren aber
  # nicht in die Ausgabe - ausgeliefert werden nur die fertigen WebP.
  - quellen/
